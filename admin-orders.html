<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Orange Robot Store</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap');
  :root{
    --ink:#0d0b09; --smoke:#1a1410; --smoke2:#241d16; --smoke3:#2e2519;
    --ash:#7a6e62; --key-gold:#c9a84c; --rust-glow:#e06820; --white:#f5f0e8;
    --green:#4caf50; --amber:#e0a020;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--ink); color:var(--white); font-family:'Inter', sans-serif; padding: 1.5rem; }
  h1{ font-family:'Cinzel', serif; color:var(--key-gold); font-size:1.4rem; text-align:center; }

  .login-box{ max-width:320px; margin:4rem auto; text-align:center; }
  .login-box input{
    width:100%; padding:0.8rem; border-radius:8px; border:1px solid var(--smoke3);
    background:var(--smoke2); color:var(--white); font-size:1rem; margin-bottom:0.8rem;
  }
  .login-box button{
    width:100%; padding:0.8rem; border:none; border-radius:8px; background:var(--key-gold);
    color:#1a1204; font-weight:700; cursor:pointer; font-family:'Cinzel', serif;
  }
  .err{ color:#d9534f; font-size:0.85rem; margin-top:0.6rem; }

  #dashboard{ display:none; max-width:900px; margin:0 auto; }
  .summary{ display:flex; gap:0.8rem; margin: 1.2rem 0 1.6rem; flex-wrap:wrap; }
  .summary .box{ flex:1; min-width:120px; background:var(--smoke2); border:1px solid var(--smoke3); border-radius:8px; padding:0.8rem; text-align:center; }
  .summary .box .n{ font-family:'IBM Plex Mono', monospace; font-size:1.3rem; font-weight:700; color:var(--key-gold); }
  .summary .box .l{ font-size:0.7rem; color:var(--ash); text-transform:uppercase; letter-spacing:0.05em; }

  table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  th{ text-align:left; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ash); padding:0.5rem; border-bottom:1px solid var(--smoke3); }
  td{ padding:0.6rem 0.5rem; border-bottom:1px solid var(--smoke3); vertical-align:top; }
  .status-pill{ padding:2px 8px; border-radius:20px; font-size:0.72rem; font-weight:700; }
  .status-paid{ background:rgba(76,175,80,0.15); color:var(--green); }
  .status-pending{ background:rgba(224,160,32,0.15); color:var(--amber); }
  .ship-addr{ font-size:0.78rem; color:var(--ash); white-space:pre-line; }
  .ship-btn{
    padding:5px 10px; border-radius:6px; border:1px solid var(--rust-glow); background:transparent;
    color:var(--rust-glow); font-size:0.75rem; cursor:pointer;
  }
  .ship-btn:disabled{ border-color:var(--smoke3); color:var(--ash); cursor:default; }
  .refresh-btn{
    display:block; margin: 0 auto 1rem; padding:0.5rem 1.2rem; border-radius:8px; border:1px solid var(--smoke3);
    background:var(--smoke2); color:var(--white); cursor:pointer; font-family:'Inter', sans-serif;
  }
</style>
</head>
<body>

<h1>🤖 Orange Robot — Orders</h1>
<div style="text-align:center; margin-bottom:1rem;">
  <a href="admin-settings.html" style="color:var(--ash); font-size:0.8rem; text-decoration:none;">⚙ Prices &amp; Shipping Settings</a>
</div>

<div class="login-box" id="loginBox">
  <input type="password" id="pwInput" placeholder="Admin password" />
  <button id="loginBtn">VIEW ORDERS</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="dashboard">
  <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  <div class="summary" id="summary"></div>
  <table>
    <thead>
      <tr><th>Order</th><th>Format</th><th>Status</th><th>Amount</th><th>Contact / Shipping</th><th>Action</th></tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>
</div>

<script>
  // ⚠️ Replace with your deployed store worker URL after `wrangler deploy`.
  const API_BASE = 'https://orange-robot-store.victor-cb4.workers.dev';
  let PASSWORD = '';

  const loginBox = document.getElementById('loginBox');
  const dashboard = document.getElementById('dashboard');
  const loginErr = document.getElementById('loginErr');

  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    PASSWORD = document.getElementById('pwInput').value;
    const ok = await loadOrders();
    if(ok){
      loginBox.style.display = 'none';
      dashboard.style.display = 'block';
    }
  });
  document.getElementById('refreshBtn').addEventListener('click', loadOrders);

  async function loadOrders(){
    try{
      const res = await fetch(API_BASE + '/admin/orders', {
        headers: { 'X-Admin-Password': PASSWORD }
      });
      if(res.status === 401){
        loginErr.textContent = 'Wrong password.';
        return false;
      }
      const data = await res.json();
      renderOrders(data.orders || []);
      return true;
    } catch(e){
      loginErr.textContent = 'Could not reach the store worker.';
      return false;
    }
  }

  function renderOrders(orders){
    const paid = orders.filter(o=>o.status==='paid');
    const pendingVerify = orders.filter(o=>o.status!=='paid');
    const pendingShip = paid.filter(o=>o.format==='physical' && !o.shipped);
    const totalUsd = paid.reduce((s,o)=>s+(o.amountUsd||0),0);

    document.getElementById('summary').innerHTML = `
      <div class="box"><div class="n">${orders.length}</div><div class="l">Total Orders</div></div>
      <div class="box"><div class="n">${pendingVerify.length}</div><div class="l">Awaiting Verification</div></div>
      <div class="box"><div class="n">${pendingShip.length}</div><div class="l">Awaiting Shipment</div></div>
      <div class="box"><div class="n">$${totalUsd.toFixed(2)}</div><div class="l">Total Revenue (verified)</div></div>
    `;

    const body = document.getElementById('ordersBody');
    body.innerHTML = orders.map(o=>{
      const date = new Date(o.createdAt).toLocaleDateString();
      const contact = o.format === 'physical'
        ? `<div class="ship-addr">${o.shipping?.name||''}\n${o.shipping?.address||''}\n${o.shipping?.city||''}, ${o.shipping?.region||''} ${o.shipping?.postal||''}\n${o.shipping?.country||''}${o.email ? '\n'+o.email : ''}</div>`
        : (o.email || '<span style="color:var(--ash)">—</span>');
      const txid = o.txid ? `<div style="font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--ash);word-break:break-all;margin-top:0.3rem;">TX: ${o.txid}</div>` : '';
      const actionCell = o.status !== 'paid'
        ? `<button class="ship-btn" onclick="markPaid('${o.id}')">Mark Paid</button>`
        : (o.format === 'physical'
            ? (o.shipped
                ? '<span style="color:var(--green);font-size:0.78rem;">✓ Shipped</span>'
                : `<button class="ship-btn" onclick="markShipped('${o.id}')">Mark Shipped</button>`)
            : '<span style="color:var(--ash);font-size:0.78rem;">n/a</span>');

      return `<tr>
        <td><span style="font-family:'IBM Plex Mono',monospace;font-size:0.75rem;">${o.id}</span><br/><span style="color:var(--ash);font-size:0.72rem;">${date}</span>${txid}</td>
        <td>${o.format}</td>
        <td><span class="status-pill status-${o.status==='paid'?'paid':'pending'}">${o.status==='paid'?'paid':'unverified'}</span></td>
        <td style="font-family:'IBM Plex Mono',monospace;">$${(o.amountUsd||0).toFixed(2)}</td>
        <td>${contact}</td>
        <td>${actionCell}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--ash);padding:2rem;">No orders yet.</td></tr>';
  }

  window.markPaid = async function(id){
    await fetch(API_BASE + '/admin/verify/' + id, {
      method: 'POST',
      headers: { 'X-Admin-Password': PASSWORD }
    });
    loadOrders();
  };

  window.markShipped = async function(id){
    await fetch(API_BASE + '/admin/ship/' + id, {
      method: 'POST',
      headers: { 'X-Admin-Password': PASSWORD }
    });
    loadOrders();
  };
</script>
</body>
</html>
